services:
  # Local LLM & Embedding Server (Zero-Cost Local AI)
  ollama:
    image: ollama/ollama:latest
    container_name: spring-ai-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # PostgreSQL with Vector Extension (PgVector)
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: spring-ai-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: spring_ai_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Chroma Vector Database
  chroma:
    image: chromadb/chroma:latest
    container_name: spring-ai-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  # Jaeger Distributed Tracing & LLM Observability
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: spring-ai-jaeger
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

volumes:
  ollama_data:
  pgvector_data:
  chroma_data:
