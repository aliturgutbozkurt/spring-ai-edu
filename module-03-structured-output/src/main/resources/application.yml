server:
  port: 8083

spring:
  application:
    name: module-03-structured-output
  threads:
    virtual:
      enabled: true

  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        enabled: true
        options:
          model: ${OLLAMA_MODEL:llama3.2}
          temperature: 0.1

logging:
  level:
    com.springai.edu: DEBUG
    org.springframework.ai: INFO
